display_name: Hiddify
package_name: hiddify
maintainer:
  name: hiddify
  email: linux@hiddify.com

priority: optional
section: x11
installed_size: 6604
essential: false
# VPN mode asks for the administrator password once, through pkexec (policykit-1 on older releases)
dependencies:
  - pkexec | policykit-1
icon: assets/images/source/ic_launcher_border.png

# Matches the GTK application id (linux/CMakeLists.txt), so the window gets the launcher's icon
startup_wm_class: app.hiddify.com

# fastforge puts its own /usr/bin/hiddify symlink lines before these, outside any case.
# dpkg runs postinst on every configure (install, upgrade, dpkg-reconfigure), so this only does
# what is safe to repeat: it drops the per-user launchers the AppImage wrote (marked
# X-AppImage-Name), which would hide the system one, and leaves every other user file alone.
postinstall_scripts:
  - |
    case "$1" in
      configure)
        for desktop in /home/*/.local/share/applications/hiddify.desktop /root/.local/share/applications/hiddify.desktop; do
          if [ -f "$desktop" ] && grep -q '^X-AppImage-Name=' "$desktop"; then
            rm -f "$desktop"
          fi
        done
        if command -v update-desktop-database >/dev/null 2>&1; then
          update-desktop-database -q /usr/share/applications || true
        fi
        ;;
    esac

# dpkg also runs postrm with "upgrade" on every update, so user data (profiles, settings) is
# removed only on purge. The app keeps it in ~/.local/share/app.hiddify.com, or in
# ~/.local/share/hiddify when an older version made that one first (path_provider's fallback).
postuninstall_scripts:
  - |
    case "$1" in
      purge)
        for data_home in /home/*/.local/share /root/.local/share; do
          rm -rf "$data_home/app.hiddify.com" "$data_home/hiddify"
        done
        ;;
      remove)
        if command -v update-desktop-database >/dev/null 2>&1; then
          update-desktop-database -q /usr/share/applications || true
        fi
        ;;
    esac

keywords:
  - Hiddify
  - Proxy
  - VPN
  - V2ray
  - Nekoray
  - Xray
  - Psiphon
  - OpenVPN

generic_name: Hiddify

categories:
  - Network

startup_notify: true
# app_links setup for Linux
# https://github.com/llfbandit/app_links/blob/master/doc/README_linux.md
supported_mime_type:
  - x-scheme-handler/hiddify
  - x-scheme-handler/v2ray
  - x-scheme-handler/v2rayn
  - x-scheme-handler/v2rayng
  - x-scheme-handler/clash
  - x-scheme-handler/clashmeta
  - x-scheme-handler/sing-box

metainfo: linux/packaging/app.hiddify.com.appdata.xml