display_name: Hiddify
url: https://github.com/hiddify/hiddify-app
license: Other
summary: A multi-platform proxy client based on Sing-box universal proxy tool-chain.

packager: hiddify
packagerEmail: linux@hiddify.com

icon: assets/images/source/ic_launcher_border.png

keywords:
  - Hiddify
  - Proxy
  - VPN
  - V2ray
  - Nekoray
  - Xray
  - Psiphon
  - OpenVPN

generic_name: Hiddify

# The libraries the bundle links (the tray icon's libayatana-appindicator3.so.1 among them) are
# not listed here: rpmbuild adds them itself as soname requirements, which every distribution
# resolves to its own package. A package name would not: Fedora calls the tray library
# libayatana-appindicator-gtk3, openSUSE libayatana-appindicator3-1.
requires:
  # VPN mode asks for the administrator password once, through pkexec
  - polkit

categories:
  - Network

startup_notify: true

# app_links setup for Linux
# https://github.com/llfbandit/app_links/blob/master/doc/README_linux.md
supported_mime_type:
  - x-scheme-handler/hiddify
  - x-scheme-handler/v2ray
  - x-scheme-handler/v2rayn
  - x-scheme-handler/v2rayng
  - x-scheme-handler/clash
  - x-scheme-handler/clashmeta
  - x-scheme-handler/sing-box
