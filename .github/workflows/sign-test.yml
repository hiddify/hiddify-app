# Branch-only test of Windows signing: builds and signs the Windows packages, publishes nothing.
# Lives on the sign-test branch only; delete it before merging.
name: Sign test

on:
  push:
    branches: [sign-test]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codegen:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-flutter
        with:
          platform: common
          install-deps: false
      - name: Pack the generated code
        run: |
          set -euo pipefail
          git ls-files --others -- lib test > "$RUNNER_TEMP/generated-files.txt"
          test -s "$RUNNER_TEMP/generated-files.txt"
          tar -czf generated-code.tar.gz -T "$RUNNER_TEMP/generated-files.txt"
      - uses: actions/upload-artifact@v6
        with:
          name: generated-code
          path: generated-code.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  windows:
    needs: codegen
    uses: ./.github/workflows/build-windows.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      attestations: write
      actions: read
    with:
      release: true
      channel: dev
