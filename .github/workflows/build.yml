name: Build
on:
  workflow_call:
    inputs:
      upload-artifact:
        type: boolean
        default: true
      tag-name:
        type: string
        default: "draft"
      channel:
        type: string
        default: "dev"

env:
  IS_GITHUB_ACTIONS: 1
  CHANNEL: "${{ inputs.channel }}"
  FLUTTER_VERSION: '3.38.5'
  NDK_VERSION: r28c
  UPLOAD_ARTIFACT: "${{ inputs.upload-artifact }}"
  TAG_NAME: "${{ inputs.tag-name }}"
  TARGET_NAME_gz: "Hiddify-Linux-x64-AppImage.tar"
  TARGET_NAME_AppImage: "Hiddify-Linux-x64-AppImage"
  TARGET_NAME_deb: "Hiddify-Debian-x64"
  # TARGET_NAME_rpm: "Hiddify-rpm-x64"
  TARGET_NAME_apk: "Hiddify-Android"
  TARGET_NAME_aab: "Hiddify-Android"
  TARGET_NAME_exe: "Hiddify-Windows-Setup-x64"
  # Must match prepare_release_notes.py / README asset names (Setup-x64.Msix).
  TARGET_NAME_msix: "Hiddify-Windows-Setup-x64"
  TARGET_NAME_zip: "Hiddify-Windows-Portable-x64"
  TARGET_NAME_dmg: "Hiddify-MacOS"
  TARGET_NAME_pkg: "Hiddify-MacOS-Installer"
  TARGET_NAME_macos_appstore_pkg: "Hiddify-MacOS-AppStore"
  TARGET_NAME_macos_appstore_dmg: "Hiddify-MacOS-AppStore"
  TARGET_NAME_ipa: "Hiddify-iOS"
  

jobs:
  test:
    permissions:
      contents: read
    outputs:
      draftBuildCode: ${{ steps.draftBuildCode.outputs.datetime }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2.21.0 #issue with 2.13
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Validate iOS release configuration
        run: python3 .github/scripts/validate_ios_release_config.py

      - name: Prepare
        run: make linux-amd64-prepare

      - name: Analyze Dart and Flutter sources
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: make draftBuildCode
        id: draftBuildCode
        run: echo "::set-output name=datetime::$(date +'%d.%H.%M')"


  build:
    needs: test
    permissions:
      contents: read
      # Azure Artifact Signing (azure/login OIDC) and actions/attest-build-provenance
      id-token: write
      attestations: write
    continue-on-error: ${{ matrix.platform != 'ios' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Quote multi-target lists: in YAML flow maps, commas start a new key
          # (`targets: exe,msix,zip` was parsed as targets=exe only).
          - { platform: android-apk,       os: ubuntu-latest,  targets: apk }
          # - { platform: android-aab,       os: ubuntu-latest,  targets: aab }
          - { platform: windows,          os: windows-latest, aarch: amd64,     targets: "exe,msix,zip" }
          - { platform: linux,            os: ubuntu-22.04,   aarch: amd64,     targets: "deb,gz,AppImage" }
          # - { platform: linux-amd64,      os: ubuntu-22.04,   aarch: amd64,     targets: "deb,gz" }
          # - { platform: linux-arm64,      os: ubuntu-24.04-arm, aarch: arm64,   targets: "deb,gz" }
          # - { platform: linux-amd64-musl, os: ubuntu-22.04,   aarch: amd64,     targets: "deb,gz" }
          # - { platform: linux-arm64-musl, os: ubuntu-24.04-arm, aarch: arm64,   targets: "deb,gz" }
          - { platform: macos,            os: macos-15,       aarch: universal, targets: "dmg,pkg" }
          # - { platform: macos-appstore,   os: macos-26,       aarch: universal, targets: "pkg,dmg" }
          # - { platform: ios,              os: macos-26,       aarch: universal, filename: hiddify-ios, targets: ipa }
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout
        uses: actions/checkout@v6

      # Explicit keychain password (not a repo secret): v6's auto-generated
      # keychain-password output is often empty in the next step, which makes
      # `security unlock-keychain` fail with "passphrase is not correct".
      - name: Import Apple Codesign Certificates
        id: apple-certs
        if: ${{ inputs.upload-artifact && startsWith(matrix.os,'macos') }}
        uses: apple-actions/import-codesign-certs@v6
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}
          keychain-password: hiddify-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Import Apple Mobile Provisioning Profile
        if: ${{ inputs.upload-artifact && startsWith(matrix.os,'macos') }}
        env:
          KEYCHAIN_PASSWORD: hiddify-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.APPLE_MOBILE_PROVISIONING_PROFILES_TARGZ_BASE64 }}" | base64 --decode | tar xz -C ~/Library/MobileDevice/Provisioning\ Profiles
          ls ~/Library/MobileDevice/Provisioning\ Profiles
          # Xcode 16+ also reads this folder.
          mkdir -p ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles
          cp ~/Library/MobileDevice/Provisioning\ Profiles/* ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" signing_temp.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" signing_temp.keychain
          security find-identity -v -p codesigning
          # Fail early: a broken APPLE_CERTIFICATE_P12 imports certs but no private keys.
          identities="$(security find-identity -v -p codesigning | grep -c 'Apple Distribution' || true)"
          if [[ "$identities" -lt 1 ]]; then
            echo '::error::No Apple Distribution identity after importing APPLE_CERTIFICATE_P12. Re-export the .p12 from Keychain Access → My Certificates (must include the private key), base64 it, and update the secret.'
            exit 1
          fi

      # - name: Setup Flutter for arm64
      #   if: ${{ startsWith(matrix.platform,'linux-arm64') }}
      #   uses: hurelhuyag/flutter-arm64-action@HEAD
      #   with:
      #     channel: 'stable'
      #     flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.21.0 #issue with 2.13
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          # flutter-version-file: pubspec.yaml
          channel: 'stable'
          cache: true

      # macOS tunnel xcframework comes from hiddify-lib-macos.tar.gz via `make macos-libs`
      # (built in hiddify-core CI); no submodule / Go bind on the app runner.

      - name: Configure macOS signing
        if: matrix.platform == 'macos'
        env:
          MACOS_SIGNING_XCCONFIG: ${{ secrets.APPLE_MACOS_SIGNING_XCCONFIG }}
          SIGN_RELEASE: ${{ inputs.upload-artifact }}
        shell: bash
        run: |
          set -euo pipefail
          signing_config="$RUNNER_TEMP/hiddify-macos-signing.xcconfig"
          # With a Developer ID the VPN runs in the packet tunnel system extension. Without one, the
          # build is signed ad hoc and its VPN runs in the root helper the user installs.
          if [[ "$SIGN_RELEASE" == 'true' && -n "$MACOS_SIGNING_XCCONFIG" ]]; then
            printf '%s\n' "$MACOS_SIGNING_XCCONFIG" > "$signing_config"
            echo 'MACOS_DEVELOPER_ID=true' >> "$GITHUB_ENV"
          else
            if [[ "$SIGN_RELEASE" == 'true' ]]; then
              echo '::warning::APPLE_MACOS_SIGNING_XCCONFIG is not set, so the macOS release is built without a Developer ID.'
            fi
            cp macos/Runner/Configs/Unsigned.xcconfig "$signing_config"
            echo 'MACOS_DEVELOPER_ID=false' >> "$GITHUB_ENV"
          fi
          echo "XCODE_XCCONFIG_FILE=$signing_config" >> "$GITHUB_ENV"

      - name: Clean up disk space
        if: startsWith(matrix.platform,'android')
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet
          df -h
          sudo rm -rf /opt/ghc
          df -h
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h
          rm -rf ~/.gradle/caches
          df -h
          sudo apt-get autoremove -y
          df -h
          sudo apt-get clean 
          df -h
          tree
      
      - name: Setup Java
        if: startsWith(matrix.platform,'android')
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 17
      # - name: Setup NDK
      #   if: startsWith(matrix.platform,'android')
      #   uses: nttld/setup-ndk@v1
      #   id: setup-ndk
      #   with:
      #     ndk-version: ${{ env.NDK_VERSION }}
      #     add-to-path: true
      #     link-to-sdk: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        if: startsWith(matrix.platform,'android')
        with:
          # default also installs the legacy 'tools' package, which no longer exists
          packages: platform-tools
      # - name: Cache Android SDK
      #   uses: actions/cache@v5
      #   if: startsWith(matrix.platform,'android')
      #   with:
      #     path: |
      #       /usr/local/lib/android/sdk
      #     key: android-sdk-${{ runner.os }}-${{ env.NDK_VERSION }}
      #     restore-keys: |
      #       android-sdk-${{ runner.os }}-      
      - name: Cache Gradle
        uses: actions/cache@v5
        if: startsWith(matrix.platform,'android')

        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-
                  
      - name: Setup dependencies
        run: |
          make ${{ matrix.platform }}-install-deps  
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Setup Android Signing Properties
        if: ${{ inputs.upload-artifact && startsWith(matrix.platform,'android') }}
        run: |
          echo "${{ secrets.ANDROID_SIGNING_KEY }}" | base64 --decode > android/key.jks
          echo "storeFile=$(pwd)/android/key.jks" > android/key.properties
          echo "storePassword=${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}" >> android/key.properties

      # Windows code signing. A publicly trusted certificate is what keeps the
      # Go/Flutter binaries off the VirusTotal "trojan" heuristics; see
      # docs/windows-code-signing.md for the secrets and the backend choice
      # (Azure Artifact Signing preferred, CA-issued PFX as fallback).
      - name: Configure Windows code signing
        if: ${{ inputs.upload-artifact && startsWith(matrix.platform,'windows') }}
        shell: pwsh
        env:
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_CERT_PROFILE: ${{ secrets.AZURE_SIGNING_CERT_PROFILE }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          WINDOWS_SIGNING_PUBLISHER: ${{ secrets.WINDOWS_SIGNING_PUBLISHER }}
          WINDOWS_SIGNING_KEY: ${{ secrets.WINDOWS_SIGNING_KEY }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          WINDOWS_SIGNING_SHA1: ${{ secrets.WINDOWS_SIGNING_SHA1 }}
        run: |
          & .\windows\scripts\configure_windows_signing.ps1

      - name: Azure login (OIDC) for Artifact Signing
        if: ${{ inputs.upload-artifact && startsWith(matrix.platform,'windows') && env.WINDOWS_SIGN_BACKEND == 'ArtifactSigning' && env.AZURE_OIDC == 'true' }}
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # - name: Temporary disable Permission Handler for windows due to its issue in permission
      #   if: ${{ startsWith(matrix.platform,'windows') }}
      #   run: |
      #     (Get-Content -Path "pubspec.yaml") -notmatch "permission_handler" | Set-Content -Path "pubspec.yaml"
      #     (Get-Content -Path "lib\features\profile\add\add_profile_modal.dart") -notmatch "qr_code_scanner_screen" | Set-Content -Path "lib\features\profile\add\add_profile_modal.dart"
      #     (Get-Content -Path lib\features\profile\add\add_profile_modal.dart) -replace 'await QRCodeScannerScreen\(\).open\(context\);', 'null;' | Set-Content -Path lib\features\profile\add\add_profile_modal.dart
      #     Remove-Item -Path "lib\features\common\qr_code_scanner_screen.dart"




      - name: Prepare for ${{ matrix.platform }}
        if: matrix.platform != 'macos-appstore' || inputs.upload-artifact
        run: |
          make ${{ matrix.platform }}-prepare


      - name: Build ${{ matrix.platform }}
        if: matrix.platform != 'macos-appstore' && matrix.platform != 'windows' && (matrix.platform != 'ios' || inputs.upload-artifact)
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          make ${{ matrix.platform }}-release

      # Portable zip uses portable=true (separate build). Setup/MSIX need a non-portable
      # Release tree that is Authenticode-signed *before* Inno/MSIX pack so dropped PE
      # files during install are signed (reduces Sysmon/AV "unsigned dropper" noise).
      - name: Build Windows portable zip
        if: matrix.platform == 'windows' && inputs.upload-artifact
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: make windows-zip-release

      - name: Build Windows Setup/MSIX binaries
        if: matrix.platform == 'windows' && inputs.upload-artifact
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: make windows-validate

      - name: Code Sign Windows Release tree
        if: matrix.platform == 'windows' && inputs.upload-artifact
        env:
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        shell: pwsh
        run: |
          & .\windows\scripts\sign_windows_artifacts.ps1 -Path build\windows\x64\runner\Release

      - name: Package Windows Setup and MSIX
        if: matrix.platform == 'windows' && inputs.upload-artifact
        # fastforge runs `flutter build windows` again before packing, which re-copies
        # unsigned plugin DLLs; the Makefile passes a fastforge pre-package hook
        # (WINDOWS_PACKAGE_HOOK) that signs the Release tree right before Inno/MSIX
        # read it. The Inno compiler then signs Setup.exe and the uninstaller through
        # the "hiddifysign" Sign Tool (HIDDIFY_INNO_SIGNTOOL). Both need this env.
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        shell: pwsh
        run: |
          make windows-exe-release
          make windows-msix-release

      - name: Build the Mac App Store version
        if: matrix.platform == 'macos-appstore' && inputs.upload-artifact
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        # Upload is a separate step so a bad APPSTORE_* secret still leaves pkg/dmg artifacts.
        run: make macos-appstore-release

      - name: Validate iOS without code signing
        if: matrix.platform == 'ios' && !inputs.upload-artifact
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: make ios-validate

      - name: Smoke test production app in iOS Simulator
        if: matrix.platform == 'ios' && !inputs.upload-artifact
        timeout-minutes: 30
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: bash .github/scripts/smoke_test_ios_simulator.sh

      - name: Validate Windows without code signing
        if: matrix.platform == 'windows' && !inputs.upload-artifact
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: make windows-validate

      - name: Code Sign Windows packages
        if: ${{ inputs.upload-artifact && startsWith(matrix.platform,'windows') }}
        # Signs Setup.exe / MSIX and PE files inside the portable .zip.
        # Skips files that already verify as signed (MSVC runtimes; pre-signed Release PE).
        env:
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        shell: pwsh
        run: |
          & .\windows\scripts\sign_windows_artifacts.ps1 -Path dist

      - name: Copy to out Windows
        if: matrix.platform == 'windows' && inputs.upload-artifact
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -Recurse | Select-Object FullName
          New-Item -ItemType Directory -Path "out" -Force | Out-Null
          $targets = "${{ matrix.targets }}".Split(',') | ForEach-Object { $_.Trim() } | Where-Object { $_ }
          Write-Host "Windows copy targets: $($targets -join ', ')"
          foreach ($ext in $targets) {
            $key = "TARGET_NAME_$ext"
            $targetName = [Environment]::GetEnvironmentVariable($key)
            if (-not $targetName) { throw "Missing env $key for extension .$ext" }

            # Case-insensitive match: dist may use .Msix / .msix / .zip / .exe
            $files = Get-ChildItem -Path dist -Recurse -File | Where-Object {
              $_.Extension.TrimStart('.').ToLowerInvariant() -eq $ext.ToLowerInvariant()
            }
            if (-not $files) {
              Write-Warning "No *.$ext under dist for $targetName"
              continue
            }
            foreach ($file in $files) {
              # Preserve catalog casing for msix (Hiddify-Windows-Setup-x64.Msix).
              $outExt = if ($ext -eq 'msix') { 'Msix' } else { $ext }
              $destination = Join-Path -Path "out" -ChildPath "$targetName.$outExt"
              Write-Host "Moving $($file.FullName) -> $destination"
              Move-Item -Path $file.FullName -Destination $destination -Force
            }
          }
          Get-ChildItem -Path out

      # SLSA build provenance for the Windows assets (verifiable with
      # `gh attestation verify <file> --repo hiddify/hiddify-app`). Lets users and
      # AV vendors confirm the files come from this public CI, which is what
      # false-positive dispute forms ask for.
      - name: Attest build provenance (Windows)
        if: matrix.platform == 'windows' && inputs.upload-artifact
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: out/*

      - name: Upload Debug Symbols
        if: ${{ inputs.upload-artifact && inputs.tag-name != 'draft' }}
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_DIST: ${{ matrix.platform == 'android-aab' && 'google-play' || 'general' }}
        run: |
          dart pub global activate sentry_dart_plugin
          dart run sentry_dart_plugin 
      
      

              
      - name: Copy to out Android APK
        if: matrix.platform == 'android-apk'
        run: |
          mkdir out
          ls -R ./build/app/outputs
          cp ./build/app/outputs/flutter-apk/*arm64-v8a*.apk out/${TARGET_NAME_apk}-arm64.apk || echo "no arm64 apk"
          cp ./build/app/outputs/flutter-apk/*armeabi-v7a*.apk out/${TARGET_NAME_apk}-arm7.apk || echo "no arm7 apk"
          cp ./build/app/outputs/flutter-apk/*x86_64*.apk out/${TARGET_NAME_apk}-x86_64.apk || echo "no x64 apk"
          cp ./build/app/outputs/flutter-apk/app-release.apk out/${TARGET_NAME_apk}-universal.apk || echo "no universal apk"

      - name: Copy to out Android AAB
        if: matrix.platform == 'android-aab'
        run: |
          mkdir out
          ls -R ./build/app/outputs
          cp ./build/app/outputs/bundle/release/app-release.aab out/hiddify-android-market.aab || echo "no aab"

      - name: Copy to out macOS App Store
        if: matrix.platform == 'macos-appstore' && inputs.upload-artifact
        id: macos-appstore-out
        run: |
          ls -R dist/
          mkdir -p out
          pkg="$(find dist -name '*-macos-appstore.pkg' -type f | head -1)"
          dmg="$(find dist -name '*-macos-appstore.dmg' -type f | head -1)"
          if [[ -z "$pkg" ]]; then
            echo '::error::macos-appstore pkg not found under dist/'
            exit 1
          fi
          if [[ -z "$dmg" ]]; then
            echo '::error::macos-appstore dmg not found under dist/'
            exit 1
          fi
          cp "$pkg" "out/${TARGET_NAME_macos_appstore_pkg}.pkg"
          cp "$dmg" "out/${TARGET_NAME_macos_appstore_dmg}.dmg"
          ls -la out/

      - name: Copy to out unix
        if: startsWith(matrix.platform,'linux') || matrix.platform == 'macos' || (matrix.platform == 'ios' && inputs.upload-artifact)
        run: |
          ls -R dist/
          mkdir out
          mkdir tmp_out
          
          for EXT in $(echo ${{ matrix.targets }} | tr ',' '\n'); do
            KEY=TARGET_NAME_${EXT}
            FILENAME=${!KEY}
            echo "For $EXT ($KEY) filename is ${FILENAME}"
            mv dist/*/*.$EXT tmp_out/${FILENAME}.$EXT
            ls tmp_out
            [[ "$EXT" != "gz" ]] && chmod +x tmp_out/${FILENAME}.$EXT || echo "Skipping chmod for gz"
            if [ "${{matrix.platform}}" == "linux" ];then
              cp ./.github/help/linux/* tmp_out/
            else
              cp ./.github/help/mac-windows/* tmp_out/
            fi
            if [[ "${{matrix.platform}}" == 'ios' ]];then
              echo mv tmp_out/${FILENAME}.$EXT out/
              mv tmp_out/${FILENAME}.$EXT out/
            else
              cd tmp_out
              # 7z a ${FILENAME}.zip ./
              # mv ${FILENAME}.zip ../out/
              # [[ $EXT == 'AppImage' ]]&& mv ${FILENAME}.$EXT ../out/ # added for appimage link
              mv ${FILENAME}.$EXT ../out/
              cd ..
            fi
          done

      - name: Sign installer and notarize macOS packages
        if: ${{ inputs.upload-artifact && matrix.platform == 'macos' && env.MACOS_DEVELOPER_ID == 'true' }}
        env:
          APPLE_MACOS_INSTALLER_SIGN_IDENTITY: ${{ secrets.APPLE_MACOS_INSTALLER_SIGN_IDENTITY }}
          APPLE_NOTARIZATION_APPLE_ID: ${{ secrets.APPLE_NOTARIZATION_APPLE_ID }}
          APPLE_NOTARIZATION_TEAM_ID: ${{ secrets.APPLE_NOTARIZATION_TEAM_ID }}
          APPLE_NOTARIZATION_PASSWORD: ${{ secrets.APPLE_NOTARIZATION_PASSWORD }}
        shell: bash
        run: |
          bash macos/scripts/notarize-release.sh "out/${TARGET_NAME_dmg}.dmg" "out/${TARGET_NAME_pkg}.pkg"
      - name: Verify signed iOS IPA
        if: ${{ inputs.upload-artifact && matrix.platform == 'ios' }}
        run: python3 .github/scripts/verify_signed_ipa.py out/Hiddify-iOS.ipa

      - name: Upload Artifact
        if: env.UPLOAD_ARTIFACT == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ${{matrix.platform}}
          path: ./out
          retention-days: 1

      # Profiles only — leave signing_temp.keychain for import-codesign-certs post cleanup.
      - name: Clean up provisioning profiles
        if: ${{ always() && startsWith(matrix.os,'macos') }}
        run: |
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision || true
          rm -rf ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles || true
  update-draft:
    # Always refresh the moving `draft` tag/release to this build's commit and assets.
    if: ${{ inputs.upload-artifact }}
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Artifact
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true
          pattern: "*"
          path: ./out/

      - name: Display Files Structure
        run: ls -R
        working-directory: ./out

      - name: Remove old draft release and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Drop the previous draft release + tag so the new upload can retag
          # github.sha as `draft` (softprops alone will not move an existing tag).
          if gh release view draft >/dev/null 2>&1; then
            gh release delete draft --yes --cleanup-tag
          elif git ls-remote --tags origin refs/tags/draft | grep -q .; then
            git push origin :refs/tags/draft
          fi

      - name: prepare_release_message
        run: |
          set -euo pipefail
          # Draft release download URLs always use the `draft` tag, even when this
          # workflow was also invoked for a versioned tag-name.
          cp ./.github/release_message.md release.md
          python3 ./.github/scripts/prepare_release_notes.py release.md ./out draft

      - name: Create draft release on current commit
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ./out/*
          name: draft
          tag_name: draft
          target_commitish: ${{ github.sha }}
          body_path: ./release.md
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: false

  virustotal-draft:
    if: ${{ inputs.upload-artifact }}
    needs: [update-draft]
    uses: ./.github/workflows/virustotal_scan.yml
    secrets: inherit
    permissions:
      contents: write
    with:
      release_tag: draft

  upload-release:
    if: ${{ inputs.upload-artifact && inputs.tag-name != 'draft' }}
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: Download Artifact
        uses: actions/download-artifact@v7
        with:
          merge-multiple: true
          pattern: "*"
          path: ./out/

      - name: Display Files Structure
        run: |
          ls -R ./out
          ls -R ./.github/
          ls -R ./.git/
          mv out/hiddify-android-market.aab  hiddify-android-market.aab

      - name: prepare_release_message
        run: |
          set -euo pipefail
          cp ./.github/release_message.md release.md
          python3 ./.github/scripts/prepare_release_notes.py release.md ./out "${{ env.TAG_NAME }}"

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        if: ${{ success() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # prerelease: ${{ env.CHANNEL == 'dev' }}
          prerelease: true
          tag_name: ${{ env.TAG_NAME }}
          body_path: './release.md'
          files: ./out/*

      - name: Create service_account.json
        run: echo '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}' > service_account.json

      - name: Deploy to Google Play Internal Testers
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: service_account.json
          packageName: app.hiddify.com
          releaseName: ${{ env.TAG_NAME }}
          releaseFiles: ./hiddify-android-market.aab
          track: 'beta'

  virustotal-release:
    if: ${{ inputs.upload-artifact && inputs.tag-name != 'draft' }}
    needs: [upload-release]
    uses: ./.github/workflows/virustotal_scan.yml
    secrets: inherit
    permissions:
      contents: write
    with:
      release_tag: ${{ inputs.tag-name }}

  # After the draft release is published: same App Store Connect API key for iOS + macOS.
  upload-to-testflight:
    needs: [update-draft]
    permissions:
      actions: read
      contents: read
    if: ${{ inputs.upload-artifact }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Download iOS artifact
        continue-on-error: true
        id: dl-ios
        uses: actions/download-artifact@v7
        with:
          name: ios
          path: ./out/

      - name: Check iOS IPA
        id: ios
        run: |
          if [[ -f out/Hiddify-iOS.ipa ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            ls -la out/Hiddify-iOS.ipa
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No iOS IPA artifact; skipping TestFlight upload."
          fi

      - name: Upload iOS IPA to TestFlight
        if: steps.ios.outputs.present == 'true'
        uses: Apple-Actions/upload-testflight-build@v5
        with:
          app-path: out/Hiddify-iOS.ipa
          app-type: ios
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Download macOS App Store artifact
        continue-on-error: true
        id: dl-macos
        uses: actions/download-artifact@v7
        with:
          name: macos-appstore
          path: ./out/

      - name: Check macOS App Store pkg
        id: macos
        run: |
          if [[ -f out/Hiddify-MacOS-AppStore.pkg ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            ls -la out/Hiddify-MacOS-AppStore.pkg
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No macOS App Store pkg artifact; skipping TestFlight upload."
          fi

      - name: Upload macOS App Store pkg to TestFlight
        if: steps.macos.outputs.present == 'true'
        uses: Apple-Actions/upload-testflight-build@v5
        with:
          app-path: out/Hiddify-MacOS-AppStore.pkg
          app-type: macos
          backend: altool
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
