name: CI
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'test.configs/**'
      - '.vscode/'
      - 'appcast.xml'
  push:
    branches:
       - main
       - dev
       - android-fix-action-bug
       - new-design-v2 
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/'
      - 'appcast.xml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    permissions:
      actions: read
      contents: read
    if: "${{!contains(github.event.head_commit.message, 'release: version')}}"
    with:
      # Signing credentials are only exposed to tag-triggered release builds.
      # CI compiles the same pinned production core and entry point as a stable
      # release, but without signing.
      upload-artifact: false
      channel: prod
      
