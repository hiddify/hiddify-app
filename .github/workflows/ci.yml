name: CI
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches:
      - fix/baseline-vpn-reliability
    paths-ignore:
      - '**.md'
      - 'docs/**'

permissions: {}

concurrency:
  group: baseline-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  run:
    uses: ./.github/workflows/baseline-telemetry.yml
    permissions:
      contents: read
