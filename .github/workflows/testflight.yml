# Uploads the iOS IPA and the Mac App Store pkg of this run, or of an earlier one (store-upload.yml),
# to TestFlight. The two uploads are independent: one failing does not skip the other.
#
# Two ways to authenticate, chosen by which secrets are set:
#  - APPLE_UPLOAD_APPLE_ID + APPLE_UPLOAD_APP_PASSWORD: a dedicated Apple ID with an
#    app-specific password (.github/scripts/upload_testflight.sh). That user can be
#    limited to the Hiddify apps. Preferred when both are configured.
#  - APPSTORE_ISSUER_ID + APPSTORE_API_KEY_ID + APPSTORE_API_PRIVATE_KEY: an App
#    Store Connect Team API key, which reaches every app of the team.
name: TestFlight

on:
  workflow_call:
    inputs:
      run-id:
        description: The run whose ios and macos-appstore artifacts to upload. Empty - this run.
        type: string
        default: ''
      ios:
        description: Upload the iOS IPA.
        type: boolean
        default: true
      macos:
        description: Upload the Mac App Store pkg.
        type: boolean
        default: true

jobs:
  upload:
    name: testflight-upload
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      actions: read
      # Pushes the ios-build/<version>/<build> tags that record the build numbers App Store Connect took.
      contents: write
    env:
      APPLE_UPLOAD_APPLE_ID: ${{ secrets.APPLE_UPLOAD_APPLE_ID }}
      APPLE_UPLOAD_APP_PASSWORD: ${{ secrets.APPLE_UPLOAD_APP_PASSWORD }}
      APPLE_UPLOAD_ASC_PROVIDER: ${{ secrets.APPLE_UPLOAD_ASC_PROVIDER }}
      # apple-id | api-key | none
      UPLOAD_AUTH: ${{ (secrets.APPLE_UPLOAD_APPLE_ID != '' && secrets.APPLE_UPLOAD_APP_PASSWORD != '') && 'apple-id' || (secrets.APPSTORE_ISSUER_ID != '' && secrets.APPSTORE_API_KEY_ID != '' && secrets.APPSTORE_API_PRIVATE_KEY != '') && 'api-key' || 'none' }}
    steps:
      - name: Show the authentication
        run: |
          if [[ "$UPLOAD_AUTH" == none ]]; then
            echo "::notice::TestFlight upload skipped - set APPLE_UPLOAD_APPLE_ID + APPLE_UPLOAD_APP_PASSWORD, or the APPSTORE_* API key secrets."
          else
            echo "TestFlight upload authenticates with ${UPLOAD_AUTH}"
          fi

      - uses: actions/checkout@v6
        if: env.UPLOAD_AUTH == 'apple-id'
        with:
          sparse-checkout: .github/scripts

      # A build that failed or was not made leaves no artifact: that upload is skipped.
      - name: Download the iOS artifact
        if: inputs.ios
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: ios
          path: out
          run-id: ${{ inputs.run-id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Download the Mac App Store artifact
        if: inputs.macos
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: macos-appstore
          path: out
          run-id: ${{ inputs.run-id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Check which builds are there
        id: found
        run: |
          if [[ -f out/Hiddify-iOS.ipa ]]; then
            ls -la out/Hiddify-iOS.ipa
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "No iOS IPA artifact; skipping its TestFlight upload."
          fi
          if [[ -f out/Hiddify-MacOS-AppStore.pkg ]]; then
            ls -la out/Hiddify-MacOS-AppStore.pkg
            echo "macos=true" >> "$GITHUB_OUTPUT"
          else
            echo "No macOS App Store pkg artifact; skipping its TestFlight upload."
          fi

      # ---- iOS ----

      - name: Upload the iOS IPA (Apple ID)
        id: ios-apple-id
        if: steps.found.outputs.ios == 'true' && env.UPLOAD_AUTH == 'apple-id'
        run: |
          set -o pipefail
          bash .github/scripts/upload_testflight.sh ios out/Hiddify-iOS.ipa 2>&1 | tee "$RUNNER_TEMP/ios-upload.log"

      - name: Upload the iOS IPA (API key)
        id: ios-api-key
        if: steps.found.outputs.ios == 'true' && env.UPLOAD_AUTH == 'api-key'
        uses: Apple-Actions/upload-testflight-build@665328adbecbc3ad929d3da710696d928b8a7ba9 # v5.9.0
        with:
          app-path: out/Hiddify-iOS.ipa
          app-type: ios
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      # The next build of this version takes one more than the highest of these tags. A number App
      # Store Connect refused as already uploaded (a build sent some other way) is recorded too, so
      # the next run moves past it.
      - name: Record the iOS build number
        if: >-
          !cancelled() && steps.found.outputs.ios == 'true' &&
          (steps.ios-apple-id.outcome == 'success' || steps.ios-api-key.outcome == 'success' ||
           steps.ios-apple-id.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          UPLOADED: ${{ steps.ios-apple-id.outcome == 'success' || steps.ios-api-key.outcome == 'success' }}
        run: |
          set -euo pipefail
          if [ "$UPLOADED" != "true" ] && ! grep -qiE "ITMS-4238|Redundant Binary Upload|already uploaded a build" "$RUNNER_TEMP/ios-upload.log" 2>/dev/null; then
            echo "The upload failed for another reason; nothing to record."
            exit 0
          fi
          unzip -p out/Hiddify-iOS.ipa 'Payload/*.app/Info.plist' > "$RUNNER_TEMP/Info.plist"
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$RUNNER_TEMP/Info.plist")"
          build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$RUNNER_TEMP/Info.plist")"
          tag="ios-build/$version/$build"
          if gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" >/dev/null 2>"$RUNNER_TEMP/tag.err"; then
            echo "Recorded $tag"
          elif grep -q "Reference already exists" "$RUNNER_TEMP/tag.err"; then
            echo "$tag was recorded already"
          else
            cat "$RUNNER_TEMP/tag.err"; exit 1
          fi

      # ---- macOS ----

      # !cancelled(): a failed iOS upload does not skip the Mac one
      - name: Upload the Mac App Store pkg (Apple ID)
        if: ${{ !cancelled() && steps.found.outputs.macos == 'true' && env.UPLOAD_AUTH == 'apple-id' }}
        run: bash .github/scripts/upload_testflight.sh macos out/Hiddify-MacOS-AppStore.pkg

      - name: Upload the Mac App Store pkg (API key)
        if: ${{ !cancelled() && steps.found.outputs.macos == 'true' && env.UPLOAD_AUTH == 'api-key' }}
        uses: Apple-Actions/upload-testflight-build@665328adbecbc3ad929d3da710696d928b8a7ba9 # v5.9.0
        with:
          app-path: out/Hiddify-MacOS-AppStore.pkg
          app-type: macos
          backend: altool
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

  # Only the newest ios-build/<version>/<build> tag matters: the next iOS build of a new version
  # starts from pubspec's number, and one of this version needs only the highest. After every
  # upload keep that tag and remove the rest. Runs after `upload`, so the number this run
  # recorded is the one kept.
  prune-ios-build-tags:
    name: testflight-prune-build-tags
    needs: upload
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Keep only the newest ios-build tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # "<version> <build>" per tag, highest version then highest build last
          tags="$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/ios-build/" --jq '.[].ref' \
            | sed -n 's|^refs/tags/ios-build/\([0-9][0-9.]*\)/\([0-9][0-9]*\)$|\1 \2|p' \
            | sort -t' ' -k1,1V -k2,2n)"
          if [ -z "$tags" ]; then
            echo "No ios-build tags."
            exit 0
          fi
          keep="$(tail -n 1 <<< "$tags")"
          echo "Keeping ios-build/${keep% *}/${keep#* }"
          head -n -1 <<< "$tags" | while read -r version build; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/ios-build/$version/$build" >/dev/null
            echo "Removed ios-build/$version/$build"
          done
