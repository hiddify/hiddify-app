name: Android one-tap APK

on:
  push:
    branches: ['feat/android-one-tap-*']
  pull_request:
    paths:
      - '.github/workflows/android-one-tap.yml'
      - 'lib/features/one_tap/**'
      - 'test/features/one_tap/**'
      - 'android/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-one-tap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-apk:
    # SQLite 3.37 on 22.04 rejects ADD COLUMN CHECK with DQS disabled,
    # as used by Drift's SchemaVerifier. Keep strict migration checks enabled.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MIT_REQUIRE_AWG_NATIVE_TESTS: 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Check Mit branding resources
        run: python3 .github/scripts/check_mit_branding.py

      - name: Read Android alpha version
        id: alpha
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          text = Path('lib/features/one_tap/mit_release.dart').read_text()
          name = re.search(r"buildName = '([0-9A-Za-z.+-]+)'", text).group(1)
          number = re.search(r'buildNumber = ([0-9]+)', text).group(1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'name={name}\nnumber={number}\n')
          print(f'Android alpha: {name} ({number})')
          PY

      - name: Check strict SQLite migration runtime
        run: |
          python3 - <<'PY'
          import sqlite3
          print('SQLite:', sqlite3.sqlite_version)
          db = sqlite3.connect(':memory:')
          db.setconfig(sqlite3.SQLITE_DBCONFIG_DQS_DDL, False)
          db.setconfig(sqlite3.SQLITE_DBCONFIG_DQS_DML, False)
          db.execute('CREATE TABLE profile_entries (id TEXT PRIMARY KEY)')
          db.execute("INSERT INTO profile_entries VALUES ('synthetic-profile')")
          db.execute('ALTER TABLE "profile_entries" ADD COLUMN "pinned" INTEGER NOT NULL DEFAULT (0) CHECK ("pinned" IN (0, 1))')
          assert db.execute('SELECT pinned FROM profile_entries').fetchone() == (0,)
          db.close()
          PY

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: '3.38.5'
          channel: stable
          cache: true

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install pinned Android toolchain
        id: toolchain
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 2>&1 | tee "$RUNNER_TEMP/mit-toolchain.log"

      - name: Summarize toolchain failure
        if: always() && steps.toolchain.outcome == 'failure'
        run: python3 .github/scripts/summarize_flutter_tests.py --prepare "$RUNNER_TEMP/mit-toolchain.log" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve locked dependencies and generate sources
        id: prepare
        run: |
          set -euo pipefail
          {
            flutter pub get --enforce-lockfile
            dart run build_runner build --delete-conflicting-outputs
            dart run slang
          } 2>&1 | tee "$RUNNER_TEMP/mit-prepare.log"

      - name: Summarize preparation failure
        if: always() && steps.prepare.outcome == 'failure'
        run: python3 .github/scripts/summarize_flutter_tests.py --prepare "$RUNNER_TEMP/mit-prepare.log" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare native libraries for Linux tests and Android
        run: make linux-amd64-libs android-libs SHELL=/bin/bash '.SHELLFLAGS=-euo pipefail -c'

      - name: Stage native core at the Flutter test FFI path
        run: |
          test -s hiddify-core/bin/lib/hiddify-core.so
          cp hiddify-core/bin/lib/hiddify-core.so hiddify-core/hiddify-core.so

      - name: Check iOS configuration remains consistent
        run: python3 .github/scripts/validate_ios_release_config.py

      - name: Analyze
        id: analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee "$RUNNER_TEMP/flutter-analyze.log"

      - name: Summarize analysis failure
        if: always() && steps.analyze.outcome == 'failure'
        run: python3 .github/scripts/summarize_flutter_tests.py --flutter-analyze "$RUNNER_TEMP/flutter-analyze.log" >> "$GITHUB_STEP_SUMMARY"

      - name: Test pilot
        run: timeout --signal=TERM --kill-after=10s 5m flutter test test/features/one_tap --timeout 90s --machine > "$RUNNER_TEMP/one-tap-tests.jsonl"

      - name: Test full suite
        run: flutter test --timeout 90s --machine > "$RUNNER_TEMP/flutter-tests.jsonl"

      - name: Summarize test results
        if: always()
        run: python3 .github/scripts/summarize_flutter_tests.py "$RUNNER_TEMP/one-tap-tests.jsonl" "$RUNNER_TEMP/flutter-tests.jsonl" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload rendered UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mits-vpn-ui-${{ github.sha }}
          path: build/ui-preview/
          if-no-files-found: ignore
          retention-days: 14

      - name: Build pilot APK with a disposable debug signing key
        id: build
        run: flutter build apk --debug --dart-define=ONE_TAP_VPN=true --build-name=${{ steps.alpha.outputs.name }} --build-number=${{ steps.alpha.outputs.number }} 2>&1 | tee "$RUNNER_TEMP/android-build.log"

      - name: Summarize build failure
        if: always() && steps.build.outcome == 'failure'
        run: python3 .github/scripts/summarize_flutter_tests.py --android-build "$RUNNER_TEMP/android-build.log" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify packaged Mit identity
        run: python3 .github/scripts/check_mit_branding.py build/app/outputs/flutter-apk/app-debug.apk

      - name: Prepare download and checksum
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-debug.apk artifacts/one-tap-vpn-debug.apk
          cd artifacts
          sha256sum one-tap-vpn-debug.apk > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: one-tap-vpn-debug-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
