# Shows the build number the next TestFlight upload of the iOS app gets, and the uploads App Store
# Connect has, without building anything. Signs in with APPLE_UPLOAD_APPLE_ID and
# APPLE_UPLOAD_APP_PASSWORD, the same Apple ID as the TestFlight upload.
name: iOS next build number

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to check (empty = pubspec's, without a pre-release suffix)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  next-build-number:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Read version from pubspec
        id: pubspec
        run: |
          set -euo pipefail
          name="$(sed -n 's/^version: *\([^+ ]*\)+[0-9][0-9]* *$/\1/p' pubspec.yaml)"
          base="$(sed -n 's/^version: *[^+]*+\([0-9][0-9]*\) *$/\1/p' pubspec.yaml)"
          version="${INPUT_VERSION:-${name%%[-.][a-z]*}}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "bundle-id=$(sed -n 's/^BASE_BUNDLE_IDENTIFIER *= *//p' ios/Base.xcconfig)" >> "$GITHUB_OUTPUT"
        env:
          INPUT_VERSION: ${{ inputs.version }}

      - name: Find the next build number
        id: next
        uses: ./.github/actions/ios-next-build-number
        with:
          bundle-id: ${{ steps.pubspec.outputs.bundle-id }}
          version: ${{ steps.pubspec.outputs.version }}
          base: ${{ steps.pubspec.outputs.base }}
          apple-id: ${{ secrets.APPLE_UPLOAD_APPLE_ID }}
          app-password: ${{ secrets.APPLE_UPLOAD_APP_PASSWORD }}

      - name: Summary
        run: |
          echo "### iOS ${{ steps.pubspec.outputs.version }}: next build number ${{ steps.next.outputs.build }}" >> "$GITHUB_STEP_SUMMARY"

      # Transporter's reply lists versions, build numbers and upload states, nothing secret; kept so
      # the parser can be checked against it.
      - name: Keep Transporter's reply
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: transporter-status-all
          path: ${{ runner.temp }}/transporter-status-all.txt
          if-no-files-found: ignore
          retention-days: 7
