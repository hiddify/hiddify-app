# Windows Setup.exe, MSIX and portable zip.
#
# Code signing: a publicly trusted certificate is what keeps the Go/Flutter binaries off the
# VirusTotal "trojan" heuristics. See docs/windows-code-signing.md for the secrets and the
# backend choice (Azure Artifact Signing preferred, CA-issued PFX as fallback).
# SignPath takes over the PE files and Setup.exe when the repository variable
# SIGNPATH_SIGNING_POLICY_SLUG is set (the MSIX stays on the PFX: the Store re-signs it).
name: Build Windows

on:
  workflow_call:
    inputs:
      release:
        description: Sign and package the build and upload it as an artifact. Off, the job only checks that it builds.
        type: boolean
        required: true
      channel:
        description: dev or prod (the Makefile's CHANNEL).
        type: string
        required: true
      upload-symbols:
        description: Upload the debug symbols to Sentry.
        type: boolean
        default: false
      build-number:
        description: Unused here (the store builds take it); build.yml passes the same inputs to every platform.
        type: string
        default: ''

env:
  CHANNEL: ${{ inputs.channel }}
  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
  # The Makefile uses the POSIX rm of the runner instead of cmd's rmdir.
  IS_GITHUB_ACTIONS: 1

jobs:
  build:
    name: windows-x64
    runs-on: windows-latest
    timeout-minutes: 60
    # A failed build does not stop the release of the other platforms.
    continue-on-error: true
    env:
      USE_SIGNPATH: ${{ inputs.release && vars.SIGNPATH_SIGNING_POLICY_SLUG != '' }}
    permissions:
      contents: read
      # signpath/github-action-submit-signing-request reads the uploaded artifacts.
      actions: read
      # Azure Artifact Signing (azure/login OIDC) and actions/attest-build-provenance
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-flutter
        with:
          platform: windows
          generated-code: true

      - name: Configure code signing
        if: inputs.release
        env:
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_CERT_PROFILE: ${{ secrets.AZURE_SIGNING_CERT_PROFILE }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          WINDOWS_SIGNING_PUBLISHER: ${{ secrets.WINDOWS_SIGNING_PUBLISHER }}
          WINDOWS_SIGNING_KEY: ${{ secrets.WINDOWS_SIGNING_KEY }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          WINDOWS_SIGNING_SHA1: ${{ secrets.WINDOWS_SIGNING_SHA1 }}
        run: |
          & .\windows\scripts\configure_windows_signing.ps1

      # WINDOWS_SIGN_BACKEND and AZURE_OIDC come from configure_windows_signing.ps1.
      - name: Azure login (OIDC) for Artifact Signing
        if: inputs.release && env.WINDOWS_SIGN_BACKEND == 'ArtifactSigning' && env.AZURE_OIDC == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # The non-portable Release tree. Without `release` this is the whole check; with it, the
      # tree is Authenticode-signed *before* Inno/MSIX pack it, so the PE files an install drops
      # are signed (reduces Sysmon/AV "unsigned dropper" noise).
      - name: Build the Release tree
        run: make windows-validate

      # SignPath signs on its servers from a GitHub artifact: the tree's unsigned PE files go up
      # once, and the fastforge hook (sign_release_tree.sh) copies the signed ones back after
      # every rebuild. Setup for it in SignPath: docs/windows-code-signing.md.
      - name: Stage the Release tree for SignPath
        if: env.USE_SIGNPATH == 'true'
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'signpath'
          "SIGNPATH_STAGE_DIR=$root\stage" >> $env:GITHUB_ENV
          "SIGNPATH_MANIFEST=$root\manifest.json" >> $env:GITHUB_ENV
          & .\windows\scripts\signpath_tree.ps1 -Mode Collect -Stage "$root\stage" -Manifest "$root\manifest.json"

      - name: Upload the unsigned Release tree
        id: signpath-tree-upload
        if: env.USE_SIGNPATH == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: windows-unsigned-tree
          path: ${{ env.SIGNPATH_STAGE_DIR }}
          retention-days: 1
          if-no-files-found: error

      - name: Sign the Release tree (SignPath)
        if: env.USE_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: release-tree
          github-artifact-id: ${{ steps.signpath-tree-upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/signpath/signed

      # From here on the fastforge hook applies the signed files instead of signing.
      - name: Apply the signed Release tree
        if: env.USE_SIGNPATH == 'true'
        run: |
          $signed = Join-Path $env:RUNNER_TEMP 'signpath\signed'
          & .\windows\scripts\signpath_tree.ps1 -Mode Apply -Signed $signed
          "SIGNPATH_SIGNED_DIR=$signed" >> $env:GITHUB_ENV

      # The steps below that sign need the credentials: the `&signing-env` block, which the
      # other signing steps reuse as `*signing-env`.
      - name: Sign the Release tree
        if: inputs.release && env.USE_SIGNPATH != 'true'
        env: &signing-env
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          & .\windows\scripts\sign_windows_artifacts.ps1 -Path build\windows\x64\runner\Release

      # The portable zip is a separate build (portable=true); fastforge runs the
      # sign_release_tree.sh hook in it too.
      - name: Build the portable zip
        if: inputs.release
        env: *signing-env
        run: make windows-zip-release

      # fastforge runs `flutter build windows` again before packing, which re-copies unsigned
      # plugin DLLs; the Makefile passes a fastforge pre-package hook (WINDOWS_PACKAGE_HOOK) that
      # signs the Release tree right before Inno/MSIX read it. The Inno compiler then signs
      # Setup.exe and the uninstaller through the "hiddifysign" Sign Tool (HIDDIFY_INNO_SIGNTOOL).
      - name: Package Setup.exe
        if: inputs.release
        env: *signing-env
        run: make windows-exe-release

      - name: Package the MSIX
        if: inputs.release
        env: *signing-env
        run: make windows-msix-release

      # Signs Setup.exe / MSIX and the PE files inside the portable zip. Skips files that already
      # verify as signed (MSVC runtimes; pre-signed Release PE). With SignPath the zip's PE files
      # are signed already, the MSIX was signed by the msix tool and Setup.exe goes to SignPath.
      - name: Sign the packages
        if: inputs.release && env.USE_SIGNPATH != 'true'
        env: *signing-env
        run: |
          & .\windows\scripts\sign_windows_artifacts.ps1 -Path dist

      # The names must match prepare_release_notes.py, windows-store-sync.yml and the README.
      - name: Collect the packages
        if: inputs.release
        run: |
          Get-ChildItem -Path dist -Recurse | Select-Object FullName
          New-Item -ItemType Directory -Path out -Force | Out-Null
          $names = [ordered]@{
            exe  = 'Hiddify-Windows-Setup-x64.exe'
            msix = 'Hiddify-Windows-Setup-x64.Msix'
            zip  = 'Hiddify-Windows-Portable-x64.zip'
          }
          foreach ($ext in $names.Keys) {
            $name = $names[$ext]
            # Extension matching ignores case: dist may hold .Msix or .msix
            $files = Get-ChildItem -Path dist -Recurse -File | Where-Object { $_.Extension -ieq ".$ext" }
            if (-not $files) { Write-Warning "No *.$ext under dist for $name"; continue }
            foreach ($file in $files) {
              Write-Host "Moving $($file.FullName) -> out\$name"
              Move-Item -Path $file.FullName -Destination (Join-Path out $name) -Force
            }
          }
          Get-ChildItem -Path out

      - name: Upload the unsigned Setup.exe
        id: signpath-setup-upload
        if: env.USE_SIGNPATH == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: windows-unsigned-setup
          path: out/Hiddify-Windows-Setup-x64.exe
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Sign Setup.exe (SignPath)
        if: env.USE_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: setup
          github-artifact-id: ${{ steps.signpath-setup-upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ${{ runner.temp }}/signpath/setup

      - name: Replace Setup.exe with the signed one
        if: env.USE_SIGNPATH == 'true'
        run: |
          $signed = Join-Path $env:RUNNER_TEMP 'signpath\setup\Hiddify-Windows-Setup-x64.exe'
          $sig = Get-AuthenticodeSignature -LiteralPath $signed
          if ($sig.Status -eq 'NotSigned') { throw 'SignPath returned Setup.exe unsigned' }
          Write-Host "Setup.exe signer: $($sig.SignerCertificate.Subject) ($($sig.Status))"
          Move-Item -LiteralPath $signed -Destination out\Hiddify-Windows-Setup-x64.exe -Force

      # SLSA build provenance for the Windows assets (verifiable with
      # `gh attestation verify <file> --repo hiddify/hiddify-app`). Lets users and AV vendors
      # confirm the files come from this public CI, which is what false-positive dispute forms
      # ask for.
      - name: Attest build provenance
        if: inputs.release
        continue-on-error: true
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: out/*

      - name: Upload debug symbols to Sentry
        if: inputs.release && inputs.upload-symbols
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_DIST: general
        run: |
          dart pub global activate sentry_dart_plugin
          dart run sentry_dart_plugin

      - name: Upload the artifact
        if: inputs.release
        uses: actions/upload-artifact@v6
        with:
          name: windows
          path: out
          retention-days: 1
          # The packages are compressed already.
          compression-level: 0
          if-no-files-found: error
