name: Next build number
description: >
  The build number of the next store build: one more than the highest number a store took, and
  never less than the given base. Android, iOS and macOS share it, so the bundle, the IPA and the
  Mac App Store pkg of one run carry the same number. The store uploads record every number the
  store took (or refused as used already) as a tag - android-build/<build> (google-play.yml),
  ios-build/<version>/<build> and macos-build/<version>/<build> (testflight.yml) - so no store
  sign-in is needed: with an Apple ID, neither altool (its --build-status takes only an upload's
  delivery ID) nor the GitHub runners (no Transporter app) can list a version's builds.

inputs:
  base:
    description: The lowest build number to use. Empty - the build number of pubspec.yaml.
    default: ''
  token:
    description: Token that can read the repository's tags.
    default: ${{ github.token }}

outputs:
  version:
    description: The version of pubspec.yaml without a pre-release suffix (5.5.6, not 5.5.6.dev).
    value: ${{ steps.next.outputs.version }}
  build:
    description: The next build number.
    value: ${{ steps.next.outputs.build }}

runs:
  using: composite
  steps:
    - id: next
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        BASE: ${{ inputs.base }}
      run: |
        set -euo pipefail
        name="$(sed -n 's/^version: *\([^+ ]*\)+[0-9][0-9]* *$/\1/p' pubspec.yaml)"
        pubspec_build="$(sed -n 's/^version: *[^+]*+\([0-9][0-9]*\) *$/\1/p' pubspec.yaml)"
        if [[ -z "$name" || -z "$pubspec_build" ]]; then
          echo "::error::pubspec.yaml has no 'version: <name>+<build>' line"
          exit 1
        fi
        BASE="${BASE:-$pubspec_build}"
        [[ "$BASE" =~ ^[0-9]+$ ]] || { echo "::error::base '$BASE' is not a whole number"; exit 1; }
        # matching-refs returns [] when there is no tag yet; an API error fails the step.
        taken=""
        for prefix in android-build ios-build macos-build; do
          taken+="$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$prefix/" --jq '.[].ref' \
            | sed -n "s|^refs/tags/$prefix/\([0-9.]*/\)\{0,1\}\([0-9][0-9]*\)$|\2|p")"$'\n'
        done
        highest="$(grep -E '^[0-9]+$' <<< "$taken" | sort -n | tail -n 1 || true)"
        build="$BASE"
        if [ -n "$highest" ] && [ $((highest + 1)) -gt "$build" ]; then
          build=$((highest + 1))
        fi
        echo "Highest recorded build ${highest:-none} (base $BASE), next $build"
        echo "version=${name%%[-.][a-z]*}" >> "$GITHUB_OUTPUT"
        echo "build=$build" >> "$GITHUB_OUTPUT"
