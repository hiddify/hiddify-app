name: iOS next build number
description: >
  The build number for the next TestFlight upload of a version: one more than the highest build
  recorded for it, and never less than the given base. The TestFlight upload job records every
  number App Store Connect took as a tag ios-build/<version>/<build>, so no App Store Connect
  sign-in is needed: with an Apple ID, neither altool (its --build-status takes only an upload's
  delivery ID) nor the GitHub runners (no Transporter app) can list a version's builds.

inputs:
  version:
    description: The version (CFBundleShortVersionString), without a pre-release suffix.
    required: true
  base:
    description: The lowest build number to use, normally pubspec's.
    required: true
  token:
    description: Token that can read the repository's tags.
    default: ${{ github.token }}

outputs:
  build:
    description: The next build number.
    value: ${{ steps.next.outputs.build }}

runs:
  using: composite
  steps:
    - id: next
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        VERSION: ${{ inputs.version }}
        BASE: ${{ inputs.base }}
      run: |
        set -euo pipefail
        [[ "$BASE" =~ ^[0-9]+$ ]] || { echo "::error::base '$BASE' is not a whole number"; exit 1; }
        # matching-refs returns [] when there is no tag yet; an API error fails the step.
        taken="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/ios-build/$VERSION/" --jq '.[].ref' \
          | sed -n "s|^refs/tags/ios-build/$VERSION/\([0-9][0-9]*\)$|\1|p" | sort -n)"
        highest="$(tail -n 1 <<< "$taken")"
        build="$BASE"
        if [ -n "$highest" ] && [ $((highest + 1)) -gt "$build" ]; then
          build=$((highest + 1))
        fi
        recorded="$(echo $taken | tr ' ' ',')"
        echo "$VERSION: recorded builds ${recorded:-none} (base $BASE), next $build"
        echo "build=$build" >> "$GITHUB_OUTPUT"
